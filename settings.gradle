pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // mavenLocal 供 aapt2 原生二进制等本地手工安装的工件使用；列在首位，
        // 其余依赖仍走 google()/mavenCentral()。
        mavenLocal()
        google()
        mavenCentral()
    }
}

rootProject.name = "KcpVpn"
include ':app'
